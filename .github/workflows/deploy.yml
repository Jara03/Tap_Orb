name: Upload Xcode project to Hackintosh VM

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  upload_xcode_project:
    runs-on: [self-hosted]

    steps:
      - name: Find Xcode project folder (auto)
        shell: powershell
        run: |
          $proj = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Directory -Filter "*.xcodeproj" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $proj) {
            Write-Error "No .xcodeproj found under workspace. Ensure Unity exported an iOS Xcode project in this job."
            exit 1
          }
          $iosFolder = $proj.Parent.FullName
          Write-Host "Found Xcode project: $($proj.FullName)"
          Write-Host "IOS_FOLDER: $iosFolder"
          "IOS_FOLDER=$iosFolder" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify iOS Xcode project folder exists
        shell: powershell
        run: |
          Write-Host "IOS_FOLDER = $env:IOS_FOLDER"
          if (-not (Test-Path $env:IOS_FOLDER)) {
            Write-Error "IOS_FOLDER not found: $env:IOS_FOLDER"
            exit 1
          }
          Write-Host "Top-level content:"
          Get-ChildItem $env:IOS_FOLDER | Select-Object -First 30 | Format-Table Name

      - name: Pack Xcode project folder (tar.gz)
        shell: powershell
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE "xcode_project.tar.gz"
          if (Test-Path $archive) { Remove-Item $archive -Force }

          $parent = Split-Path -Parent $env:IOS_FOLDER
          $leaf   = Split-Path -Leaf   $env:IOS_FOLDER

          Push-Location $parent
          tar -czf $archive $leaf
          Pop-Location

          Write-Host "Created: $archive"
          Get-Item $archive | Format-List Name,Length,FullName

      - name: Setup SSH (fresh)
        shell: powershell
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          if (-not $env:SSH_PRIVATE_KEY -or $env:SSH_PRIVATE_KEY.Trim().Length -eq 0) {
            Write-Error "SSH_PRIVATE_KEY secret is missing."
            exit 1
          }
          if (-not $env:KNOWN_HOSTS -or $env:KNOWN_HOSTS.Trim().Length -eq 0) {
            Write-Error "KNOWN_HOSTS secret is missing."
            exit 1
          }

          $sshDir = Join-Path $env:RUNNER_TEMP ("ssh_ci_" + $env:GITHUB_RUN_ID)
          if (Test-Path $sshDir) { Remove-Item $sshDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null

          $keyPath = Join-Path $sshDir "id_ed25519"

          $key = ($env:SSH_PRIVATE_KEY -replace "`r","").Trim() + "`n"
          [System.IO.File]::WriteAllText($keyPath, $key, (New-Object System.Text.UTF8Encoding($false)))

          icacls $keyPath /inheritance:r | Out-Null
          icacls $keyPath /remove "BUILTIN\Users" "BUILTIN\Utilisateurs" "Users" "Utilisateurs" 2>$null | Out-Null
          icacls $keyPath /grant:r "$($env:USERNAME):(R)" "SYSTEM:(R)" | Out-Null

          ssh-keygen -lf $keyPath

          $knownHostsPath = Join-Path $sshDir "known_hosts"
          $kh = ($env:KNOWN_HOSTS -replace "`r","").Trim() + "`n"
          [System.IO.File]::WriteAllText($knownHostsPath, $kh, (New-Object System.Text.UTF8Encoding($false)))

          "SSH_KEY=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SSH_KNOWN_HOSTS=$knownHostsPath" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "SSH setup OK in $sshDir"

      - name: SSH test (fast fail)
        shell: powershell
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o ConnectionAttempts=1 `
            -i "$env:SSH_KEY" -p $env:DEPLOY_PORT `
            -o UserKnownHostsFile="$env:SSH_KNOWN_HOSTS" `
            -o StrictHostKeyChecking=yes `
            "$($env:DEPLOY_USER)@$($env:DEPLOY_HOST)" "echo SSH_OK && sw_vers && whoami"

      - name: Upload and extract on VM (tar.gz)
        shell: powershell
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SHA: ${{ github.sha }}
        run: |
          if (-not $env:DEPLOY_PATH -or $env:DEPLOY_PATH.Trim().Length -eq 0) {
            Write-Error "DEPLOY_PATH variable is missing (example: /Users/hayro/TapOrbBuilds)"
            exit 1
          }

          $archiveLocal = Join-Path $env:GITHUB_WORKSPACE "xcode_project.tar.gz"
          if (-not (Test-Path $archiveLocal)) {
            Write-Error "Missing archive: $archiveLocal"
            exit 1
          }

          $short = $env:SHA.Substring(0,7)
          $releaseDir = "$($env:DEPLOY_PATH)/releases/$short"

          ssh -o BatchMode=yes -o ConnectTimeout=10 -o ConnectionAttempts=1 `
            -i "$env:SSH_KEY" -p $env:DEPLOY_PORT `
            -o UserKnownHostsFile="$env:SSH_KNOWN_HOSTS" `
            -o StrictHostKeyChecking=yes `
            "$($env:DEPLOY_USER)@$($env:DEPLOY_HOST)" "mkdir -p '$releaseDir'"

          scp -o BatchMode=yes -o ConnectTimeout=10 -o ConnectionAttempts=1 `
            -i "$env:SSH_KEY" -P $env:DEPLOY_PORT `
            -o UserKnownHostsFile="$env:SSH_KNOWN_HOSTS" `
            -o StrictHostKeyChecking=yes `
            "$archiveLocal" `
            "$($env:DEPLOY_USER)@$($env:DEPLOY_HOST):$releaseDir/xcode_project.tar.gz"

          $remoteCmd = "set -e; cd '$releaseDir'; rm -rf iOS; mkdir -p iOS; tar -xzf xcode_project.tar.gz -C iOS --strip-components=1; rm -f xcode_project.tar.gz; ln -sfn '$releaseDir/iOS' '$($env:DEPLOY_PATH)/current'; echo DEPLOY_OK; ls -la '$($env:DEPLOY_PATH)/current' | head -n 50"

          ssh -o BatchMode=yes -o ConnectTimeout=10 -o ConnectionAttempts=1 `
            -i "$env:SSH_KEY" -p $env:DEPLOY_PORT `
            -o UserKnownHostsFile="$env:SSH_KNOWN_HOSTS" `
            -o StrictHostKeyChecking=yes `
            "$($env:DEPLOY_USER)@$($env:DEPLOY_HOST)" "$remoteCmd"

      - name: Pod install + Xcode Archive (remote)
        shell: powershell
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SHA: ${{ github.sha }}
        run: |
          $short = $env:SHA.Substring(0,7)

          # Build the bash script as a SINGLE string, but do NOT use bash heredocs in PowerShell.
          # We'll write it to a file and pipe it to ssh stdin.
          $script = @"
          set -euo pipefail
          
          CUR="$($env:DEPLOY_PATH)/current"
          ARCHIVES_DIR="$($env:DEPLOY_PATH)/archives/$short"
          SCHEME="Unity-iPhone"
          
          echo "== Current path: $CUR =="
          cd "$CUR"
          
          echo "== Listing current =="
          ls -la | head -n 80
          
          # --- POD INSTALL ---
          if [ -f "Podfile" ]; then
            echo "== Podfile found. Running pod install =="
            if ! command -v pod >/dev/null 2>&1; then
              echo "ERROR: CocoaPods (pod) not found on VM."
              exit 1
            fi
          
            export LANG=en_US.UTF-8
            export LC_ALL=en_US.UTF-8
          
            pod install --repo-update
          else
            echo "== No Podfile in current. Skipping pod install. =="
          fi
          
          echo "== After pods, workspaces/projects =="
          ls -la *.xcworkspace 2>/dev/null || true
          ls -la *.xcodeproj 2>/dev/null || true
          
          WORKSPACE="$(ls -1 *.xcworkspace 2>/dev/null | head -n 1 || true)"
          PROJECT="$(ls -1 *.xcodeproj 2>/dev/null | head -n 1 || true)"
          
          mkdir -p "$ARCHIVES_DIR"
          ARCHIVE_PATH="$ARCHIVES_DIR/$SCHEME.xcarchive"
          
          echo "== Archive target =="
          echo "WORKSPACE=$WORKSPACE"
          echo "PROJECT=$PROJECT"
          echo "SCHEME=$SCHEME"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH"
          
          # Optional: dump list to help debug scheme name
          xcodebuild -list 2>/dev/null || true
          
          if [ -n "$WORKSPACE" ]; then
            xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -archivePath "$ARCHIVE_PATH" archive -allowProvisioningUpdates | tee "$ARCHIVES_DIR/xcodebuild_archive.log"
          elif [ -n "$PROJECT" ]; then
            xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release -archivePath "$ARCHIVE_PATH" archive -allowProvisioningUpdates | tee "$ARCHIVES_DIR/xcodebuild_archive.log"
          else
            echo "ERROR: No .xcworkspace or .xcodeproj found in current."
            exit 1
          fi
          
          echo "== Archive done. Contents: =="
          ls -la "$ARCHIVES_DIR" | head -n 80
          "@
          
                    $tmp = Join-Path $env:RUNNER_TEMP "remote_build_$short.sh"
                    # Write UTF-8 no BOM, keep LF
                    [System.IO.File]::WriteAllText($tmp, ($script -replace "`r",""), (New-Object System.Text.UTF8Encoding($false)))
          
                    Write-Host "Wrote remote script: $tmp"
                    Write-Host "First lines:"
                    Get-Content $tmp -TotalCount 10
          
                    # Pipe the script to ssh STDIN => executed by bash on the VM
                    Get-Content $tmp -Raw | ssh -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=1 `
                      -i "$env:SSH_KEY" -p $env:DEPLOY_PORT `
                      -o UserKnownHostsFile="$env:SSH_KNOWN_HOSTS" `
                      -o StrictHostKeyChecking=yes `
                      "$($env:DEPLOY_USER)@$($env:DEPLOY_HOST)" "bash -s"
